const loaded={};
const names=['snow','mtb','wind','climb'];
const labels={snow:'Snowboard',mtb:'MTB',wind:'Wind Sport',climb:'Climbing'};
let active='snow';
function sourceText(b64){const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(bytes)}
function status(message){document.getElementById('moduleState').textContent=message}
function updateNetwork(){const online=navigator.onLine;document.getElementById('netstate').textContent=online?'Online · Meteo e ricerca richiedono internet':'Offline · Ricerca e previsioni potrebbero non funzionare'}
window.addEventListener('online',updateNetwork);window.addEventListener('offline',updateNetwork);updateNetwork();
function makeFrame(which){
 const frame=document.createElement('iframe');frame.id='pane-'+which;frame.title='Sport Radar '+labels[which];frame.setAttribute('loading','eager');frame.setAttribute('allow','geolocation');
 frame.addEventListener('load',()=>{if(active===which)status(labels[which]+' caricato · dati online da verificare')});
 frame.addEventListener('error',()=>{if(active===which)status('Caricamento non riuscito · premi ↻')});
 frame.srcdoc=sourceText(DATA[which]);return frame;
}
function show(which,force=false){
 if(!names.includes(which))return;active=which;
 for(const x of names){const tab=document.getElementById('tab-'+x);tab.setAttribute('aria-selected',String(x===which));tab.tabIndex=x===which?0:-1;if(loaded[x])loaded[x].hidden=x!==which;}
 if(force&&loaded[which]){loaded[which].remove();delete loaded[which]}
 if(!loaded[which]){status('Caricamento '+labels[which]+'…');try{const frame=makeFrame(which);loaded[which]=frame;document.getElementById('viewer').append(frame);document.getElementById('loading').hidden=true}catch(err){status('Errore apertura '+labels[which]+' · premi ↻');console.error(err)}}else status(labels[which]+' pronto');
 try{localStorage.setItem('sport-radar-active',which)}catch(e){}
}
for(const x of names)document.getElementById('tab-'+x).addEventListener('click',()=>show(x));
document.querySelector('.tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const i=names.indexOf(active);const next=e.key==='Home'?names[0]:e.key==='End'?names[3]:names[(i+(e.key==='ArrowRight'?1:3))%4];document.getElementById('tab-'+next).focus();show(next)});
document.getElementById('refresh').addEventListener('click',()=>{if(confirm('Ricaricare '+labels[active]+'? Le ricerche in corso verranno interrotte; i preferiti salvati restano sul dispositivo.'))show(active,true)});
document.getElementById('expand').addEventListener('click',()=>{document.body.classList.add('focus-mode');document.getElementById('returnBtn').focus()});
document.getElementById('returnBtn').addEventListener('click',()=>{document.body.classList.remove('focus-mode');document.getElementById('expand').focus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('focus-mode'))document.getElementById('returnBtn').click()});
let first='snow';try{const saved=localStorage.getItem('sport-radar-active');if(names.includes(saved))first=saved}catch(e){}show(first);
</script></body></html>
