function sourceText(b64){const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(bytes)}
function show(which){for(const x of ['snow','mtb']){let tab=document.getElementById('tab-'+x);tab.setAttribute('aria-selected',String(x===which));tab.tabIndex=x===which?0:-1;if(loaded[x])loaded[x].hidden=x!==which;}if(!loaded[which]){const frame=document.createElement('iframe');frame.id='pane-'+which;frame.title=which==='snow'?'Sport Radar Snowboard 9.0':'Sport Radar MTB 10.4';frame.setAttribute('loading','eager');frame.setAttribute('allow','geolocation');frame.srcdoc=sourceText(DATA[which]);loaded[which]=frame;document.getElementById('viewer').append(frame);document.getElementById('loading').hidden=true;}try{localStorage.setItem('sport-radar-active',which)}catch(e){}}

document.querySelector('.tabs').addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();const sel=document.getElementById('tab-snow').getAttribute('aria-selected')==='true'?'mtb':'snow';document.getElementById('tab-'+sel).focus();show(sel)});
